name: "stardist"
namespace: "methods"
version: "build_main"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input"
    label: "Unlabelled"
    summary: "Preprocessed spatial transcriptomics data without segmentation labels\
      \ for method input."
    description: "This dataset contains preprocessed images and transcript point clouds\
      \ for spatial transcriptomics data.\nGround truth segmentation labels are intentionally\
      \ excluded to prevent methods from cheating.\n"
    info:
      format:
        type: "spatialdata_zarr"
        images:
        - type: "object"
          name: "image"
          description: "The raw image data"
          required: true
        labels:
        - type: "object"
          name: "cell_labels"
          description: "Vendor-provided cell segmentation labels, exposed as a segmentation\
            \ prior"
          required: false
        - type: "object"
          name: "nucleus_labels"
          description: "Vendor-provided nucleus segmentation labels, exposed as a\
            \ segmentation prior"
          required: false
        points:
        - type: "dataframe"
          name: "transcripts"
          description: "Point cloud data of transcripts"
          required: true
          columns:
          - type: "float"
            name: "x"
            required: true
            description: "x-coordinate of the point"
          - type: "float"
            name: "y"
            required: true
            description: "y-coordinate of the point"
          - type: "float"
            name: "z"
            required: false
            description: "z-coordinate of the point"
          - type: "categorical"
            name: "feature_name"
            required: true
            description: "Name of the feature"
          - type: "float"
            name: "qv"
            required: false
            description: "Quality value of the point"
          - type: "long"
            name: "transcript_id"
            required: true
            description: "Unique identifier of the transcript"
          - type: "boolean"
            name: "overlaps_nucleus"
            required: false
            description: "Whether the point overlaps with the nucleus (derived from\
              \ morphology)"
          - type: "integer"
            name: "cell_id"
            required: false
            description: "Vendor-provided cell assignment from the raw data, exposed\
              \ as a\nsegmentation prior. This is NOT the ground truth used for\n\
              evaluation (which is held out in spatial_solution); methods may\nfreely\
              \ condition on it.\n"
        tables:
        - type: "anndata"
          name: "table"
          description: "Metadata of spatial dataset"
          required: true
          uns:
          - type: "string"
            name: "dataset_id"
            required: true
            description: "A unique identifier for the dataset"
          - type: "string"
            name: "dataset_name"
            required: true
            description: "A human-readable name for the dataset"
          - type: "string"
            name: "dataset_url"
            required: true
            description: "Link to the original source of the dataset"
          - type: "string"
            name: "dataset_reference"
            required: true
            description: "Bibtex reference of the paper in which the dataset was published"
          - type: "string"
            name: "dataset_summary"
            required: true
            description: "Short description of the dataset"
          - type: "string"
            name: "dataset_description"
            required: true
            description: "Long description of the dataset"
          - type: "string"
            name: "dataset_organism"
            required: true
            description: "The organism of the sample in the dataset"
          - type: "string"
            name: "orig_dataset_id"
            required: true
            description: "The identifier of the original dataset from which this dataset\
              \ was derived (if applicable)"
          var:
          - type: "string"
            name: "feature_id"
            required: false
            description: "Unique identifier for the feature, usually a ENSEMBL gene\
              \ id."
          - type: "string"
            name: "feature_name"
            required: true
            description: "A human-readable name for the feature, usually a gene symbol."
        coordinate_systems:
        - type: "object"
          name: "global"
          description: "Coordinate system of the replicate"
          required: true
    example:
    - "resources_test/task_spatial_segmentation/mouse_brain_combined/spatial_unlabelled.zarr"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    label: "Predicted data"
    summary: "A predicted dataset as output by a method."
    info:
      format:
        type: "spatialdata_zarr"
        labels:
        - type: "object"
          name: "segmentation"
          description: "Segmentation of the data"
          required: true
        tables:
        - type: "anndata"
          name: "table"
          description: "AnnData table"
          required: true
          uns:
          - type: "string"
            name: "dataset_id"
            description: "A unique identifier for the dataset"
            required: true
          - type: "string"
            name: "method_id"
            description: "A unique identifier for the method"
            required: true
    example:
    - "resources_test/task_spatial_segmentation/mouse_brain_combined/prediction.zarr"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--model"
    description: "Pretrained StarDist model name."
    info:
      test_default: "2D_versatile_fluo"
    default:
    - "2D_versatile_fluo"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
label: "StarDist"
summary: "Detects star-convex shaped cells by predicting radial distances to the object\
  \ boundary from each pixel."
description: "StarDist represents each cell as a star-convex polygon defined by a\
  \ set of radial distances from the cell's\ncenter pixel to its boundary, measured\
  \ at evenly spaced angles. A U-Net–style convolutional neural network\nis trained\
  \ to predict, for every pixel, both the probability that the pixel lies inside any\
  \ cell and the\nset of radial distances describing the cell polygon centered at\
  \ that pixel. At inference time, non-maximum\nsuppression selects the most confident\
  \ polygon proposals and suppresses overlapping detections, yielding a\nfinal instance-segmentation\
  \ label image. Because the star-convex parameterization compactly encodes shapes\n\
  typical of fluorescence-microscopy nuclei and cells, the method is highly data-efficient\
  \ and generalizes\nwell across imaging modalities with pretrained models such as\
  \ \"2D_versatile_fluo\".\n"
test_resources:
- type: "python_script"
  path: "run_and_check_output.py"
  is_executable: true
- type: "python_script"
  path: "check_config.py"
  is_executable: true
- type: "file"
  path: "resources_test/task_spatial_segmentation/mouse_brain_combined"
  dest: "resources_test/task_spatial_segmentation/mouse_brain_combined"
info:
  type: "method"
  type_info:
    label: "Method"
    summary: "A method."
    description: "A method to predict the task effects.\n"
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "github"
  name: "openproblems"
  repo: "openproblems-bio/openproblems"
  tag: "build/main"
- type: "github"
  name: "task_ist_preprocessing"
  repo: "openproblems-bio/task_ist_preprocessing"
  tag: "build/main"
license: "MIT"
references:
  doi:
  - "10.48550/arXiv.1806.03535"
links:
  repository: "https://github.com/stardist/stardist"
  docker_registry: "ghcr.io"
  documentation: "https://stardist.net"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "midtime"
    - "midcpu"
    - "highmem"
    - "gpu"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      lowmem: "memory = 20.Gb"
      midmem: "memory = 50.Gb"
      highmem: "memory = 100.Gb"
      lowcpu: "cpus = 5"
      midcpu: "cpus = 15"
      highcpu: "cpus = 30"
      lowtime: "time = 1.h"
      midtime: "time = 4.h"
      hightime: "time = 8.h"
      veryhightime: "time = 24.h"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "openproblems/base_python:1"
  namespace_separator: "/"
  setup:
  - type: "python"
    user: false
    pypi:
    - "spatialdata>=0.7.3"
    - "anndata>=0.12.0"
    - "zarr>=3.0.0"
    upgrade: true
  - type: "python"
    user: false
    pypi:
    - "stardist"
    upgrade: true
  - type: "python"
    user: false
    pypi:
    - "numpy<2.0.0"
    - "tensorflow"
    upgrade: true
  entrypoint: []
  cmd: null
- type: "native"
  id: "native"
build_info:
  config: "src/methods/stardist/config.vsh.yaml"
  runner: "nextflow"
  engine: "docker|native"
  output: "target/nextflow/methods/stardist"
  executable: "target/nextflow/methods/stardist/main.nf"
  viash_version: "0.9.7"
  git_commit: "fe43f68962148b9ce2aef003616ec13e990c463a"
  git_remote: "https://github.com/openproblems-bio/task_spatial_segmentation"
