name: "segger"
namespace: "methods"
version: "build_main"
argument_groups:
- name: "Arguments"
  arguments:
  - type: "file"
    name: "--input"
    label: "Unlabelled"
    summary: "Preprocessed spatial transcriptomics data without segmentation labels\
      \ for method input."
    description: "This dataset contains preprocessed images and transcript point clouds\
      \ for spatial transcriptomics data.\nGround truth segmentation labels are intentionally\
      \ excluded to prevent methods from cheating.\n"
    info:
      format:
        type: "spatialdata_zarr"
        images:
        - type: "object"
          name: "image"
          description: "The raw image data"
          required: true
        labels:
        - type: "object"
          name: "cell_labels"
          description: "Vendor-provided cell segmentation labels, exposed as a segmentation\
            \ prior"
          required: false
        - type: "object"
          name: "nucleus_labels"
          description: "Vendor-provided nucleus segmentation labels, exposed as a\
            \ segmentation prior"
          required: false
        points:
        - type: "dataframe"
          name: "transcripts"
          description: "Point cloud data of transcripts"
          required: true
          columns:
          - type: "float"
            name: "x"
            required: true
            description: "x-coordinate of the point"
          - type: "float"
            name: "y"
            required: true
            description: "y-coordinate of the point"
          - type: "float"
            name: "z"
            required: false
            description: "z-coordinate of the point"
          - type: "categorical"
            name: "feature_name"
            required: true
            description: "Name of the feature"
          - type: "float"
            name: "qv"
            required: false
            description: "Quality value of the point"
          - type: "long"
            name: "transcript_id"
            required: true
            description: "Unique identifier of the transcript"
          - type: "boolean"
            name: "overlaps_nucleus"
            required: false
            description: "Whether the point overlaps with the nucleus (derived from\
              \ morphology)"
          - type: "integer"
            name: "cell_id"
            required: false
            description: "Vendor-provided cell assignment from the raw data, exposed\
              \ as a\nsegmentation prior. This is NOT the ground truth used for\n\
              evaluation (which is held out in spatial_solution); methods may\nfreely\
              \ condition on it.\n"
        tables:
        - type: "anndata"
          name: "table"
          description: "Metadata of spatial dataset"
          required: true
          uns:
          - type: "string"
            name: "dataset_id"
            required: true
            description: "A unique identifier for the dataset"
          - type: "string"
            name: "dataset_name"
            required: true
            description: "A human-readable name for the dataset"
          - type: "string"
            name: "dataset_url"
            required: true
            description: "Link to the original source of the dataset"
          - type: "string"
            name: "dataset_reference"
            required: true
            description: "Bibtex reference of the paper in which the dataset was published"
          - type: "string"
            name: "dataset_summary"
            required: true
            description: "Short description of the dataset"
          - type: "string"
            name: "dataset_description"
            required: true
            description: "Long description of the dataset"
          - type: "string"
            name: "dataset_organism"
            required: true
            description: "The organism of the sample in the dataset"
          - type: "string"
            name: "orig_dataset_id"
            required: true
            description: "The identifier of the original dataset from which this dataset\
              \ was derived (if applicable)"
          var:
          - type: "string"
            name: "feature_id"
            required: false
            description: "Unique identifier for the feature, usually a ENSEMBL gene\
              \ id."
          - type: "string"
            name: "feature_name"
            required: true
            description: "A human-readable name for the feature, usually a gene symbol."
        coordinate_systems:
        - type: "object"
          name: "global"
          description: "Coordinate system of the replicate"
          required: true
    example:
    - "resources_test/task_spatial_segmentation/mouse_brain_combined/spatial_unlabelled.zarr"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "file"
    name: "--output"
    label: "Predicted data"
    summary: "A predicted dataset as output by a method."
    info:
      format:
        type: "spatialdata_zarr"
        labels:
        - type: "object"
          name: "segmentation"
          description: "Segmentation of the data"
          required: true
        tables:
        - type: "anndata"
          name: "table"
          description: "AnnData table"
          required: true
          uns:
          - type: "string"
            name: "dataset_id"
            description: "A unique identifier for the dataset"
            required: true
          - type: "string"
            name: "method_id"
            description: "A unique identifier for the method"
            required: true
    example:
    - "resources_test/task_spatial_segmentation/mouse_brain_combined/prediction.zarr"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--init_segmentation"
    description: "Source of the initial boundary node set that segger trains against.\n\
      'auto' uses the transcripts' `cell_id` prior column when it is\npresent and\
      \ runs Cellpose on `morphology_mip` otherwise.\n'cellpose' always runs Cellpose.\
      \ 'transcript_cell_id' requires a\n`cell_id` column on the transcripts and builds\
      \ one convex-hull\npolygon per cell id.\n"
    info: null
    default:
    - "auto"
    required: false
    choices:
    - "auto"
    - "cellpose"
    - "transcript_cell_id"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_epochs"
    description: "Number of training epochs for the GNN."
    info: null
    default:
    - 20
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--prediction_expansion_ratio"
    description: "Fraction of each polygon's equivalent radius used to expand it\n\
      when building the transcript-to-boundary prediction graph (forwarded\nas `--prediction-expansion-ratio`\
      \ to `segger segment`). Larger values\nreach more peripheral transcripts.\n"
    info: null
    default:
    - 0.5
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--prediction_mode"
    description: "Which polygon set drives the prediction graph."
    info: null
    default:
    - "nucleus"
    required: false
    choices:
    - "nucleus"
    - "cell"
    - "uniform"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "double"
    name: "--cellpose_diameter"
    description: "Cell diameter (pixels) for the Cellpose nucleus pre-segmentation."
    info: null
    default:
    - 30.0
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
label: "Segger"
summary: "Assigns transcripts to cells via a heterogeneous graph neural network with\
  \ link prediction between transcripts and morphology-derived boundary nodes."
description: "Segger frames spatial transcriptomics cell segmentation as link prediction\
  \ on a heterogeneous graph\nwhose nodes are individual transcripts and morphology-derived\
  \ cell or nucleus boundaries, and whose\nedges connect transcripts to each other\
  \ within a small radius (capturing local co-occurrence) and\ntranscripts to boundaries\
  \ when a transcript falls inside a scaled polygon. A graph neural network\nis trained\
  \ with a contrastive objective so that each transcript embedding is pulled toward\
  \ the\nembedding of its true boundary and pushed away from neighboring ones. At\
  \ inference time, every\ntranscript is reassigned to the boundary it most resembles\
  \ in embedding space, subject to a\nsimilarity threshold that is either set globally\
  \ or learned per gene. Because the model operates\non the transcript graph rather\
  \ than on raster images, it refines the initial nucleus segmentation\nwith information\
  \ about which transcripts genuinely belong to which cell, and can rescue transcripts\n\
  that the initial boundary segmentation missed. In this Viash component, an initial\
  \ boundary\nset is taken from the vendor `cell_id` prior on the transcripts whenever\
  \ it is present and\nfalls back to a Cellpose pass on `morphology_mip` when it is\
  \ not; the boundaries plus the\ntranscripts are written to a Xenium-layout directory\
  \ and handed to `segger segment`. The\nper-transcript reassignments are then projected\
  \ back onto the initial nucleus masks by\nmajority vote and rasterized as the predicted\
  \ label image.\n"
test_resources:
- type: "python_script"
  path: "check_config.py"
  is_executable: true
info:
  type: "method"
  type_info:
    label: "Method"
    summary: "A method."
    description: "A method to predict the task effects.\n"
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "github"
  name: "openproblems"
  repo: "openproblems-bio/openproblems"
  tag: "build/main"
- type: "github"
  name: "task_ist_preprocessing"
  repo: "openproblems-bio/task_ist_preprocessing"
  tag: "build/main"
license: "MIT"
references:
  doi:
  - "10.1101/2025.03.14.643160"
links:
  repository: "https://github.com/dpeerlab/segger"
  docker_registry: "ghcr.io"
  documentation: "https://github.com/dpeerlab/segger"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "hightime"
    - "midcpu"
    - "highmem"
    - "gpu"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      lowmem: "memory = 20.Gb"
      midmem: "memory = 50.Gb"
      highmem: "memory = 100.Gb"
      lowcpu: "cpus = 5"
      midcpu: "cpus = 15"
      highcpu: "cpus = 30"
      lowtime: "time = 1.h"
      midtime: "time = 4.h"
      hightime: "time = 8.h"
      veryhightime: "time = 24.h"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "nvcr.io/nvidia/pytorch:25.06-py3"
  namespace_separator: "/"
  setup:
  - type: "apt"
    packages:
    - "procps"
    - "git"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "anndata~=0.12.0"
    - "scanpy~=1.12"
    - "requests"
    - "jsonschema"
    - "spatialdata>=0.7.3"
    - "zarr>=3.0.0"
    github:
    - "openproblems-bio/core#subdirectory=packages/python/openproblems"
    upgrade: true
  - type: "docker"
    run:
    - "pip install --no-cache-dir --extra-index-url=https://pypi.nvidia.com cuspatial-cu12\n"
  - type: "python"
    user: false
    pypi:
    - "cellpose"
    - "rasterio>=1.3"
    - "geopandas"
    - "shapely"
    - "scikit-image"
    upgrade: true
  - type: "python"
    user: false
    github:
    - "dpeerlab/segger"
    upgrade: true
  entrypoint: []
  cmd: null
- type: "native"
  id: "native"
build_info:
  config: "src/methods/segger/config.vsh.yaml"
  runner: "nextflow"
  engine: "docker|native"
  output: "target/nextflow/methods/segger"
  executable: "target/nextflow/methods/segger/main.nf"
  viash_version: "0.9.7"
  git_commit: "398fd9c5f56b0f19841eb4cd23b62fd0e5d02a0f"
  git_remote: "https://github.com/openproblems-bio/task_spatial_segmentation"
package_config:
  name: "task_spatial_segmentation"
  version: "build_main"
  label: "Spatial Segmentation"
  summary: "A one sentence summary of purpose and methodology. Used for creating an\
    \ overview tables."
  description: "Provide a clear and concise description of your task, detailing the\
    \ specific problem it aims\nto solve. Outline the input data types, the expected\
    \ output, and any assumptions or constraints.\nBe sure to explain any terminology\
    \ or concepts that are essential for understanding the task.\n\nExplain the motivation\
    \ behind your proposed task. Describe the biological or computational \nproblem\
    \ you aim to address and why it's important. Discuss the current state of research\
    \ in\nthis area and any gaps or challenges that your task could help address.\
    \ This section \nshould convince readers of the significance and relevance of\
    \ your task.\n"
  info:
    image: "The name of the image file to use for the component on the website."
    test_resources:
    - type: "s3"
      path: "s3://openproblems-data/resources_test/common/2023_10x_mouse_brain_xenium_rep1/"
      dest: "resources_test/common/2023_10x_mouse_brain_xenium_rep1/"
    - type: "s3"
      path: "s3://openproblems-data/resources_test/common/2023_yao_mouse_brain_scrnaseq_10xv2/"
      dest: "resources_test/common/2023_yao_mouse_brain_scrnaseq_10xv2/"
    - type: "s3"
