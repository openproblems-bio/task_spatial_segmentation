__merge__: ../../api/comp_data_processor.yaml

name: process_dataset

argument_groups:
  - name: "Processing parameters"
    arguments:
      - name: "--span"
        type: double
        description: The fraction of the data (cells) used when estimating the variance in the loess model fit if flavor='seurat_v3'.
        default: 0.3
      - name: "--n_top_genes"
        type: integer
        description: Number of highly-variable genes to keep. Mandatory if flavor='seurat_v3'.
        default: 3000
      - name: "--test_dummy"
        type: boolean
        description: Whether or not this dataset is used for testing. If true, more data fields will be filled in to make sure the output has as many optional output fields as possible.
        default: false

resources:
  - type: python_script
    path: script.py

engines:
  - type: docker
    image: openproblems/base_python:1
    setup:
      - type: python
        packages: [scikit-learn, scikit-misc]
    __merge__: /src/base/setup_spatialdata_partial.yaml
  - type: native

runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midmem, midcpu, midtime]
